<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Portada con plano inclinado y pelotita">
  <rect width="900" height="560" fill="#eefaff"/>
  <circle cx="735" cy="95" r="62" fill="#d9f4ef"/>
  <circle cx="140" cy="455" r="95" fill="#e6f3fb"/>
  <rect x="70" y="390" width="760" height="48" rx="8" fill="#9fc0cc"/>
  <polygon points="170,360 710,180 740,230 200,410" fill="#f7c36a" stroke="#0f6fb2" stroke-width="5"/>
  <line x1="225" y1="385" x2="705" y2="226" stroke="#ffffff" stroke-width="6" stroke-dasharray="18 14"/>
  <circle cx="570" cy="245" r="39" fill="#f28c28" stroke="#b85f14" stroke-width="5"/>
  <path d="M520 245 C472 259 434 277 398 300" fill="none" stroke="#0fb7a5" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="92" y="70" width="210" height="140" rx="12" fill="#ffffff" stroke="#c7e5ef"/>
  <text x="115" y="115" font-family="Segoe UI, Arial" font-size="24" font-weight="700" fill="#0f6fb2">Ec = 1/2 mv²</text>
  <text x="115" y="158" font-family="Segoe UI, Arial" font-size="24" font-weight="700" fill="#0f9f80">Ep = mgh</text>
  <text x="115" y="195" font-family="Segoe UI, Arial" font-size="18" fill="#5d6b78">energia en movimiento</text>
  <g transform="translate(665 318)">
    <circle cx="34" cy="32" r="24" fill="#ffd6a8"/>
    <rect x="8" y="57" width="54" height="78" rx="18" fill="#0f6fb2"/>
    <rect x="-10" y="88" width="82" height="18" rx="9" fill="#20a8d8"/>
    <rect x="72" y="75" width="44" height="68" rx="8" fill="#ffffff" stroke="#0f9f80" stroke-width="4"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#0fb7a5"/>
    </marker>
  </defs>
  <text x="80" y="505" font-family="Segoe UI, Arial" font-size="34" font-weight="800" fill="#0f6fb2">Carrera de energia: plano inclinado y rozamiento</text>
